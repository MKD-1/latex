name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - uses: actions/checkout@v2
    - name: Install TeX Live packages and clangd
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-xetex texlive-lang-chinese fonts-noto-cjk clangd
    - name: Verify clangd
      run: clangd --version
    - name: Build pdf with semantic highlighting
      run: bash build.sh kactl --semantic-highlight --clangd "$(command -v clangd)"
    - name: Upload generated PDFs
      uses: actions/upload-artifact@v4
      with:
        name: kactl-pdfs
        path: |
          kactl.pdf
          test-session.pdf
    - name: Run compiles
      run: make test-compiles
    - name: Run stress tests
      run: make test
